name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version to release (e.g. 1.0.1). Must match package.json and CHANGELOG.md'
        required: true
        type: string
      prerelease:
        description: 'Mark release as a pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-plugin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-preconditions:
    name: Validate Release Preconditions
    runs-on: ubuntu-latest
    steps:
      - name: Verify execution on main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched strictly from the 'main' branch. Current ref is '${{ github.ref }}'."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release version consistency
        run: npm run release:check -- --version "${{ inputs.version }}"

      - name: Extract release notes from CHANGELOG.md
        run: npm run release:notes -- --version "${{ inputs.version }}" --output release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99baeddf # v4.6.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  readiness-gate:
    name: Evaluate Shared Release Readiness
    needs: [validate-preconditions]
    uses: ./.github/workflows/_release-readiness.yml
    with:
      ref: ${{ github.sha }}
      upload_artifact: true
      retention_days: 1

  publish-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-preconditions, readiness-gate]
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release notes artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-notes

      - name: Download release candidate distribution package
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: ${{ needs.readiness-gate.outputs.zip_name }}
          path: dist/

      - name: Generate Sigstore Build Provenance Attestation
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b71123d38008fb763f # v2.2.3
        with:
          subject-path: "dist/${{ needs.readiness-gate.outputs.zip_name }}"

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="v${{ inputs.version }}"
          echo "Creating Git tag ${TAG_NAME} pointing to commit ${{ github.sha }}..."
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}" "${{ github.sha }}"
          git push origin "${TAG_NAME}"

      - name: Publish Immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ inputs.version }}"
          ZIP_FILE="dist/${{ needs.readiness-gate.outputs.zip_name }}"
          SHA_FILE="dist/${{ needs.readiness-gate.outputs.zip_name }}.sha256"

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "Creating draft release for ${TAG_NAME}..."
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file release-notes.md \
            --draft \
            ${PRERELEASE_FLAG} \
            "${ZIP_FILE}" \
            "${SHA_FILE}"

          echo "Publishing release (finalizing immutability)..."
          gh release edit "${TAG_NAME}" --draft=false

          echo "Successfully published GitHub Release ${TAG_NAME}!"
