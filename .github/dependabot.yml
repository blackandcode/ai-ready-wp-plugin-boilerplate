version: 2
updates:
  # Maintain GitHub Actions dependencies with semantic version tags
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    allow:
      - dependency-type: "direct"

  # Maintain npm runtime and development dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "react"
        versions: ["19.x", ">= 19"]
      - dependency-name: "react-dom"
        versions: ["19.x", ">= 19"]
      - dependency-name: "typescript"
        versions: ["7.x", ">= 7"]
      - dependency-name: "@wordpress/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain Composer PHP runtime and dev dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(php)"
      include: "scope"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: ["12.x", "13.x", ">= 12"]
      - dependency-name: "php-stubs/wordpress-stubs"
        versions: ["7.x", ">= 7"]
      - dependency-name: "symfony/yaml"
        versions: ["8.x", ">= 8"]
